DISTRO = "poky"
TMPDIR = "${TOPDIR}/tmp-xen-guest"
IMAGE_FSTYPES:append = " wic wic.qcow2"
DISTRO_FEATURES:append = " xen"
# Referenced by LicenseRef-OE-Guest-Image
COPY_LIC_MANIFEST = "1"
# meta-ti deploys to ${TOPDIR}/deploy-ti regardless of TMPDIR, which collides
# with the host's deploy dir for the same MACHINE; keep the guest's separate
# (and where VESSEL_PACKAGE_DEPLOY_DIR expects it)
TI_COMMON_DEPLOY = "${TMPDIR}/deploy"
