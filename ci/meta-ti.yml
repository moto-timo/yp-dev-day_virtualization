# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json

header:
  version: 23

repos:
  meta-ti:
    url: https://git.yoctoproject.org/meta-ti.git
    layers:
      meta-beagle:
      meta-ti-bsp:
      meta-ti-extras:
    patches:
      # Pending upstream in meta-ti; drop once merged
      0006:
        repo: meta-custom
        path: kas/patches/0006-ti-core-initramfs-drop-from-IMAGE_PREPROCESS_COMMAND.patch

local_conf_header:
  meta-ti_udev-aragoconf: |
    # meta-ti's security dynamic layer appends udev-aragoconf, which only
    # exists in meta-arago
    BBMASK += "meta-ti/meta-ti-bsp/dynamic-layers/security-layer/recipes-core/udev/udev-aragoconf_%.bbappend"
